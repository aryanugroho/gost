.codeception_base:
  - &environment
    - export DEBIAN_FRONTEND=noninteractive
    - export DB_NAME="${DB_NAME}"
    - export DATABASE_MASTER_USER="${DATABASE_MASTER_USER}"
    - export DATABASE_MASTER_PASSWORD="${DATABASE_MASTER_PASSWORD}"
    - export DATABASE_MASTER_MAXOPEN="${DATABASE_MASTER_MAXOPEN}"
    - export DATABASE_MASTER_MAXIDLE="${DATABASE_MASTER_MAXIDLE}"
    - export DATABASE_MASTER_MAXLIFETIME="${DATABASE_MASTER_MAXLIFETIME}"
    - export DB_HOST="${DB_HOST}"
    - export DB_PORT="${DB_PORT}"
    - export APP_APIKEY="${APP_APIKEY}"
    - export PUBSUB_PROJECT_ID="${PUBSUB_PROJECT_ID}"
    - export TAG_NAME="v-$(date -I)-$CI_PIPELINE_ID-$CI_COMMIT_SHORT_SHA"
    - export DATADOG_API_KEY="${DD_API_KEY}"
    - export DOCKER_TAG="${CI_COMMIT_SHORT_SHA}"
    - export GCLOUD_PROJECTID="${GCLOUD_PROJECTID}"
    - export DATABASE_SLAVE_USER="${DATABASE_SLAVE_USER}"
    - export DATABASE_SLAVE_PASSWORD="${DATABASE_SLAVE_PASSWORD}"
    - export DATABASE_SLAVE_MAXOPEN="${DATABASE_SLAVE_MAXOPEN}"
    - export DATABASE_SLAVE_MAXIDLE="${DATABASE_SLAVE_MAXIDLE}"
    - export DATABASE_SLAVE_MAXLIFETIME="${DATABASE_SLAVE_MAXLIFETIME}"
  - &ssh_setup
    - 'which ssh-agent || apk add openssh-client'
    # run ssh-agent
    - eval $(ssh-agent -s)
    # add the SSH key stored in SSH_PRIVATE_KEY
    - echo "$SSH_PRIVATE_KEY" | ssh-add -
    # for Docker builds disable host key checking
    - mkdir -p ~/.ssh
    - 'echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
    - cat ~/.ssh/config
    - ssh-add -l
  - &setup_dependencies
    - apk update
    - apk add git build-base gettext busybox-extras make
    - git config --global url."git@gitlab.com:".insteadOf "https://gitlab.com/"
    - go env -w GOPRIVATE=gitlab.com/flip-id
    - export GOPRIVATE=gitlab.com/flip-id
    - GOARM=7 GOOS=linux GOARCH=amd64

.docker_base:
  variables:
    # workaround, fix later https://gitlab.com/gitlab-org/gitlab-runner/-/issues/4501
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://localhost:2375

variables:
  # Configure mysql environment variables (https://hub.docker.com/_/mysql/)
  MYSQL_ROOT_PASSWORD: "$DB_PASSWORD"
  KUSTOMIZE_VERSION: v4.1.2
  DD_API_KEY: $DD_API_KEY
  DATADOG_API_KEY: $DD_API_KEY
  DD_INSIDE_CI: "true"
  DD_HOSTNAME: "none"
  DD_AGENT_HOST: "datadog-agent"

stages:
  - build
  - package
  - deploy-dev
  - argocd-sync-dev
  - deploy-staging
  - argocd-sync-staging
  - predeploy-production
  - deploy-production
  - argocd-sync-production

