build_and_test:
  stage: build
  before_script:
    - *ssh_setup
    - *setup_dependencies
  image: asia-southeast2-docker.pkg.dev/flip-prod-sre-e490/flip-main/golang:1.16-alpine
  script:
    - go mod download
    - go test -failfast ./...
    - go build -o  cmd//main.go
  artifacts:
    paths:
      - 
  tags:
    - gcp-staging
  except:
    - tags

docker_build:
  image: asia-southeast2-docker.pkg.dev/flip-prod-sre-e490/flip-main/docker:18.09.7
  stage: package
  tags:
    - gcp-staging
  needs:
    - build_and_test
  extends: .docker_base
  services:
    - asia-southeast2-docker.pkg.dev/flip-prod-sre-e490/flip-main/docker:18.09.7-dind
  before_script:
    - export DOCKER_TAG="${CI_COMMIT_SHORT_SHA}"
    - export CONTAINER_BASE_IMAGE="asia-southeast2-docker.pkg.dev/flip-prod-sre-e490/flip-main/"
    - export DEBIAN_FRONTEND=noninteractive
    - mkdir -p $HOME/.docker
    - echo $DOCKER_AUTH_CONFIG > $HOME/.docker/config.json
    - cat $HOME/.docker/config.json
  script:
    - base64 -d $ARTIFACT_REGISTRY_SA_KEY | docker login -u _json_key --password-stdin https://asia-southeast2-docker.pkg.dev
    - docker info
    - docker build . -f Dockerfile. -t ${CONTAINER_BASE_IMAGE}:${DOCKER_TAG}
    - docker push $CONTAINER_BASE_IMAGE
  except:
    - tags

run_migrations_dev:
  image: asia-southeast2-docker.pkg.dev/flip-prod-sre-e490/flip-main/golang:1.17.alpine-datadog
  stage: deploy-dev
  environment: dev/migrate
  needs:
    - build_and_test
  tags:
    - gcp-dev
  when: manual
  before_script:
    - *ssh_setup
    - *environment
    - *setup_dependencies
  script:
    - envsubst < config-dev.yml.tmpl > config.yml
    - go mod download
    - go run cmd//main.go migrate:run
  except:
    - main
    - tags

code_push_to_gitops_dev:
  image: asia-southeast2-docker.pkg.dev/flip-prod-sre-e490/flip-main/k8s-deploy:v1.0.2
  stage: deploy-dev
  tags:
    - gcp-staging
  needs:
    - docker_build
  environment: dev/deploy
  when: manual
  before_script:
    - *environment
    - *ssh_setup
    - git config --global user.email "sre@flip.id"
    - git config --global user.name "SRE Deployer"
  script:
    - apt-get update && apt-get install gettext -y
    - |
      if [ ! -f kustomize ] ; then \
        curl -LO "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
        tar -xvf kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz
      fi;
    - cp kustomize /usr/bin/kustomize
    # Substitute the env and deploy
    - envsubst < version.env > .version.env && rm version.env && mv .version.env version.env
    - git clone git@gitlab.com:flip-id/gitops-.git
    - cp version.env gitops-/kubernetes/main/overlays/dev/
    - cp version.env gitops-/kubernetes/listener/overlays/dev/
    - cp version.env gitops-/kubernetes/cron/overlays/dev/
    - cd gitops-/kubernetes/main/overlays/dev/
    - kustomize edit set image asia-southeast2-docker.pkg.dev/flip-prod-sre-e490/flip-main/:${DOCKER_TAG}
    - cd ../../../../kubernetes/listener/overlays/dev/
    - kustomize edit set image asia-southeast2-docker.pkg.dev/flip-prod-sre-e490/flip-main/-listener:${DOCKER_TAG}
    - cd ../../../../kubernetes/cron/overlays/dev/
    - kustomize edit set image asia-southeast2-docker.pkg.dev/flip-prod-sre-e490/flip-main/-cron:${DOCKER_TAG}
    - cd ../../../../
    - git add .
    - git commit -m "Update :${DOCKER_TAG}, -listener:${DOCKER_TAG}, -cron:${DOCKER_TAG}"
    - git push
  except:
    - main
    - tags

argocd_sync_dev:
  image: asia-southeast2-docker.pkg.dev/flip-prod-sre-e490/flip-main/k8s-deploy:v1.0.2
  stage: argocd-sync-dev
  environment: dev/main
  tags:
    - gcp-staging
  needs:
    - code_push_to_gitops_dev
  script:
    - export ARGOCD_SERVER=argocd-dev.flip.id
    - curl -sSL -o /usr/bin/argocd https://${ARGOCD_SERVER}/download/argocd-linux-amd64
    - export ARGOCD_AUTH_TOKEN="${ARGOCD_AUTH_TOKEN_DEV}"
    - chmod +x /usr/bin/argocd
    - argocd app sync  --prune || true
    - argocd app wait  || true
  except:
    - main
    - tags


