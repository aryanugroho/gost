build_tag:
  image: registry-intl.ap-southeast-5.aliyuncs.com/flip-default/k8s-deploy:v1.0.2
  stage: predeploy-production
  tags:
    - gcp-staging
  script:
    - export TAG_NAME="v-$(date -I)-$CI_PIPELINE_ID-$CI_COMMIT_SHORT_SHA"
    - curl -X POST --silent --show-error --fail "https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/repository/tags?tag_name=${TAG_NAME}&ref=${CI_COMMIT_SHA}&private_token=${GIT_TOKEN_PERSONAL}"
  only:
    - main
  when: manual

build_image_tag:
  image: asia-southeast2-docker.pkg.dev/flip-prod-sre-e490/flip-main/docker:18.09.7
  stage: predeploy-production
  extends: .docker_base
  tags:
    - gcp-staging
  needs:
    - docker_build
  services:
    - asia-southeast2-docker.pkg.dev/flip-prod-sre-e490/flip-main/docker:18.09.7-dind
  before_script:
    - export DOCKER_TAG="${CI_COMMIT_SHORT_SHA}"
    - export CONTAINER_BASE_IMAGE="asia-southeast2-docker.pkg.dev/flip-prod-sre-e490/flip-main/"
    - export DEBIAN_FRONTEND=noninteractive
    - mkdir -p $HOME/.docker
    - echo $DOCKER_AUTH_CONFIG > $HOME/.docker/config.json
    - cat $HOME/.docker/config.json
    - export TAG_NAME="v-$(date -I)-$CI_PIPELINE_ID-$CI_COMMIT_SHORT_SHA"
  script:
    - base64 -d $ARTIFACT_REGISTRY_SA_KEY | docker login -u _json_key --password-stdin https://asia-southeast2-docker.pkg.dev
    - docker info
    - docker pull ${CONTAINER_BASE_IMAGE}:${DOCKER_TAG}
    - docker tag ${CONTAINER_BASE_IMAGE}:${DOCKER_TAG} ${CONTAINER_BASE_IMAGE}:${TAG_NAME}
    - docker push ${CONTAINER_BASE_IMAGE}:${TAG_NAME}
  only:
    - main
  when: manual

